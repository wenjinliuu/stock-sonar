name: Deploy compute container

# Python 计算容器（需 Workers Paid + Docker 构建）。workers/compute 有改动时自动部署。
on:
  push:
    branches: [main]
    paths: ['workers/compute/**', '.github/workflows/deploy-compute.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w workers/compute
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python 测试
        working-directory: workers/compute
        run: pip install -q -r app/requirements.txt pytest && python -m pytest -q tests
      - name: 部署（wrangler 用 Docker 构建镜像并推送到 Cloudflare 镜像仓库）
        working-directory: workers/compute
        run: npx wrangler deploy
