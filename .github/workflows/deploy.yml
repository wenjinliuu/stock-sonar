name: Deploy

# main 有推送即部署主 Worker（API + 定时拉取 + 前端）。容器另见 deploy-compute.yml。
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'design/**', '**.md']
  workflow_dispatch:

concurrency: { group: deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: 股票池生成文件与 CSV 一致
        run: python3 scripts/update_universe.py --gen-only && git diff --exit-code workers/api/src/universe.generated.ts
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python 信号计算测试（含 golden test）
        working-directory: workers/compute
        run: pip install -q -r app/requirements.txt pytest && python -m pytest -q tests
      - run: npm run build

      - name: D1 迁移
        working-directory: workers/api
        run: npx wrangler d1 migrations apply stock-sonar --remote

      - name: 准备密钥文件（来自 GitHub Secrets，不进日志）
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: |
          node -e '
            const s = {};
            if (process.env.MASSIVE_API_KEY) s.MASSIVE_API_KEY = process.env.MASSIVE_API_KEY;
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/secrets.json", JSON.stringify(s));
            console.log("secrets:", Object.keys(s).join(", ") || "(none)");
          '

      - name: 部署
        working-directory: workers/api
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/secrets.json"

      - if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
