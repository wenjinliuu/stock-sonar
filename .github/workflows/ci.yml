name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: 股票池生成文件与 CSV 一致
        run: python3 scripts/update_universe.py --gen-only && git diff --exit-code workers/api/src/universe.generated.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
