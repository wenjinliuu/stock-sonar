name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - name: 股票池生成文件与 CSV 一致
        run: python3 scripts/update_universe.py --gen-only && git diff --exit-code workers/api/src/universe.generated.ts
      - run: npm run typecheck
      - run: npm test
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Python 信号计算测试（含 golden test）
        working-directory: workers/compute
        run: pip install -q -r app/requirements.txt pytest && python -m pytest -q tests
      - run: npm run build
