<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>指标抽屉</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;color:#1E2329}
a{color:#1E2329}a:hover{color:#1E2329}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: rgba(30,35,41,0.45); position: relative; overflow: hidden">
  <div style="position: absolute; left: 0; right: 0; top: 150px; bottom: 0; background: #FFFFFF; border-radius: 12px 12px 0 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 16px 8px">
      <h1 style="margin: 0; font-size: 17px; font-weight: 700">指标</h1>
      <a href="Stock.dc.html" style="text-decoration: none; font-size: 14px; font-weight: 600; padding: 8px 0 8px 12px">完成</a>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; margin: 0 16px 8px; background: #F5F5F5; border-radius: 4px; padding: 7px 10px; color: #929AA5">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>
      <input placeholder="搜索指标，如 Squeeze、RSI" aria-label="搜索指标" style="border: 0; background: transparent; font: inherit; font-size: 14px; flex-grow: 1; outline: none; color: #1E2329">
    </label>
    <div style="display: flex; gap: 22px; padding: 0 16px; border-bottom: 1px solid #EAECEF">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
        <button onClick="{{t.pick}}" style="border: 0; background: transparent; font: inherit; font-size: 14px; padding: 8px 0; margin-bottom: -1px; {{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; padding: 8px 16px; font-size: 11px; color: #707A8A">
      <span style="flex-grow: 1">名称 / 作者</span>
      <span style="width: 56px; text-align: right">点赞</span>
      <span style="width: 44px; text-align: right">位置</span>
      <span style="width: 44px; text-align: right">显示</span>
    </div>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
      <div style="display: flex; align-items: center; padding: 8px 16px; border-bottom: 1px solid #F5F5F5">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
          <span style="font-size: 14px; font-weight: 600">{{it.name}}</span>
          <span style="font-size: 11px; color: #707A8A">{{it.meta}}</span>
        </div>
        <span style="width: 56px; text-align: right; font-size: 12px; color: #474D57; font-variant-numeric: tabular-nums">{{it.likes}}</span>
        <span style="width: 44px; text-align: right; font-size: 12px; color: #707A8A">{{it.pos}}</span>
        <div style="width: 44px; display: flex; justify-content: flex-end">
          <button onClick="{{it.toggle}}" aria-label="{{it.aria}}" style="width: 36px; height: 22px; border-radius: 11px; border: 0; position: relative; padding: 0; {{it.track}}"><span style="position: absolute; top: 2px; width: 18px; height: 18px; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2); {{it.knob}}"></span></button>
        </div>
      </div>
    </sc-for>
    <div style="padding: 10px 16px; font-size: 11px; color: #707A8A; line-height: 1.5">点赞数来自 TradingView 社区；主图最多叠加 3 个、副图最多 3 个。</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { tab: 0, added: { sqz: true, st: true, wt: true, ma: true } }; }
  renderVals() {
    var self = this;
    var groups = [
      [
        { id: 'sqz', name: 'Squeeze Momentum', meta: 'LazyBear · 挤压后的突破', likes: '97.4K', pos: '副图' },
        { id: 'smc', name: 'Smart Money Concepts', meta: 'LuxAlgo · 市场结构', likes: '78.2K', pos: '主图' },
        { id: 'macd', name: 'MACD 多周期', meta: 'ChrisMoody', likes: '70.4K', pos: '副图' },
        { id: 'vix', name: 'Williams Vix Fix', meta: 'ChrisMoody · 恐慌低点', likes: '56.4K', pos: '副图' },
        { id: 'st', name: 'SuperTrend', meta: 'KivancOzbilgic · 趋势与止损', likes: '55K', pos: '主图' },
        { id: 'wt', name: 'WaveTrend', meta: 'LazyBear · 超买超卖', likes: '52.3K', pos: '副图' },
        { id: 'adx', name: 'ADX and DI', meta: 'BeikabuOyaJi · 趋势强度', likes: '41.6K', pos: '副图' },
        { id: 'sr', name: '支撑压力及突破', meta: 'LuxAlgo', likes: '33.8K', pos: '主图' }
      ],
      [
        { id: 'rs', name: 'RS 线（对 SPY）', meta: '相对强度', likes: '—', pos: '副图' },
        { id: 'mnv', name: 'Minervini 趋势模板', meta: '趋势筛选条件', likes: '—', pos: '主图' },
        { id: 'avwap', name: '锚定 VWAP', meta: '从财报日或前高锚定', likes: '—', pos: '主图' },
        { id: 'vp', name: '成交量分布', meta: '按价位统计成交', likes: '—', pos: '主图' }
      ],
      [
        { id: 'ma', name: 'MA / EMA', meta: '移动平均', likes: '—', pos: '主图' },
        { id: 'bb', name: '布林带', meta: 'Bollinger Bands', likes: '—', pos: '主图' },
        { id: 'vol', name: '成交量', meta: 'Volume', likes: '—', pos: '副图' },
        { id: 'macd0', name: 'MACD', meta: '12, 26, 9', likes: '—', pos: '副图' },
        { id: 'rsi', name: 'RSI', meta: '14', likes: '—', pos: '副图' },
        { id: 'atr', name: 'ATR', meta: '14', likes: '—', pos: '副图' }
      ]
    ];
    var tabNames = ['TradingView 热门', '美股专用', '基础', '已添加'];
    var tabs = tabNames.map(function (l, i) {
      var on = self.state.tab === i;
      return { label: l, style: on ? 'color:#1E2329;font-weight:700;border-bottom:3px solid #F0B90B' : 'color:#707A8A;border-bottom:3px solid transparent', pick: function () { self.setState({ tab: i }); } };
    });
    var list = self.state.tab === 3 ? groups[0].concat(groups[1], groups[2]).filter(function (x) { return self.state.added[x.id]; }) : groups[self.state.tab];
    var items = list.map(function (x) {
      var on = !!self.state.added[x.id];
      return {
        name: x.name, meta: x.meta, likes: x.likes, pos: x.pos, aria: (on ? '隐藏 ' : '显示 ') + x.name,
        track: on ? 'background:#F0B90B' : 'background:#D5D8DC',
        knob: on ? 'left:16px' : 'left:2px',
        toggle: function () { var a = Object.assign({}, self.state.added); a[x.id] = !on; self.setState({ added: a }); }
      };
    });
    return { tabs: tabs, items: items };
  }
}
</script>
</body>
</html>
